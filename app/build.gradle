dependencies {
    // Material Design Components (Core)
    implementation 'com.google.android.material:material:1.11.0'

    // AndroidX Core & AppCompat (Required)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'

    // ConstraintLayout (Recommended for complex layouts)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CardView (If not already included in Material)
    implementation 'androidx.cardview:cardview:1.0.0'

    // RecyclerView (For lists, if needed)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Lifecycle (For ViewModel and LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // For loading images (Glide - recommended for thumbnails)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation libs.firebase.analytics
    implementation libs.firebase.config
    implementation libs.firebase.crashlytics
    implementation libs.play.services.ads
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // FFmpegKit for merging video and audio
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-https:6.0.1'
}