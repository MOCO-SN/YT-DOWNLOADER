android {
    namespace 'msn.mocosn.cryo'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "msn.mocosn.cryo"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "2026.11"

        // Python requires specific Application Binary Interfaces (ABIs)
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources {
            excludes += [
                "/META-INF/{AL2.0,LGPL2.1}",
                "/META-INF/*.version",
                "/META-INF/**/LICENSE.txt",
                "/DebugProbesKt.bin",
                "/kotlin-tooling-metadata.json",
                "/kotlin/**.kotlin_builtins",
                "/META-INF/*.kotlin_module"
            ]
        }
    }
    testOptions {
        unitTests.includeAndroidResources = false
        unitTests.all {
            enabled = false
        }
    }
}

tasks.configureEach {
    if (name == "assembleDebug") {
        doLast {
            def outputDir = layout.buildDirectory.dir("outputs/apk/debug").get().asFile
            def defaultApk = new File(outputDir, "app-debug.apk")
            def namedApk = new File(outputDir, "YT-Downloader-debug.apk")
            if (defaultApk.exists()) {
                java.nio.file.Files.copy(
                    defaultApk.toPath(),
                    namedApk.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        }
    }
    if (name == "assembleRelease") {
        doLast {
            def outputDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
            def defaultApk = new File(outputDir, "app-release.apk")
            if (!defaultApk.exists()) {
                defaultApk = new File(outputDir, "app-release-unsigned.apk")
            }
            def namedApk = new File(outputDir, "YT-Downloader-release.apk")
            if (defaultApk.exists()) {
                java.nio.file.Files.copy(
                    defaultApk.toPath(),
                    namedApk.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        }
    }
}

